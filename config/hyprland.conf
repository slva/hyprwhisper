# hyprWhisper Configuration Example
# Add these lines to your ~/.config/hypr/hyprland.conf

# ============================================
# Important: $mainMod Variable
# ============================================
# If you use $mainMod, make sure it's defined at the TOP of your config:
# $mainMod = SUPER  # Windows/Command key
# OR
# $mainMod = ALT

# ============================================
# Basic Setup (using SUPER directly)
# ============================================

# Option 1 (recommended): SUPER + ALT + D
# (SUPER + D is already "Window: Maximize" in dots-hyprland's ii config)
bind = SUPER ALT, D, exec, ~/.local/bin/whisper-toggle.sh

# Lua config equivalent (e.g. ~/.config/hypr/custom/keybinds.lua):
# hl.bind("SUPER+ALT+D", hl.dsp.exec_cmd("$HOME/.local/bin/whisper-toggle.sh"), {description = "Whisper: toggle dictation"})

# Option 2: Use ALT key + D
# bind = ALT, D, exec, ~/.local/bin/whisper-toggle.sh

# Option 3: Use SHIFT + SUPER + D
# bind = SHIFT SUPER, D, exec, ~/.local/bin/whisper-toggle.sh

# Option 4: Use dedicated microphone key (if your keyboard has one)
# bind = ,XF86AudioMicMute, exec, ~/.local/bin/whisper-toggle.sh

# Option 5: Use $mainMod (if defined in your config)
# bind = $mainMod ALT, D, exec, ~/.local/bin/whisper-toggle.sh

# ============================================
# Environment Variables (optional)
# ============================================

# Read by Quickshell (not by the script), so they must be set before
# Quickshell starts. Restart Quickshell after changing them.
# env = WHISPER_DIR,/home/you/Apps/whisper.cpp
# env = WHISPER_MODEL,models/ggml-medium.bin
